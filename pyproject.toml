[project]
name = "databricks-uv-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "robkisk", email = "robby.kiskanyan@databricks.com" }
]
requires-python = ">=3.11"

dependencies = [
	"databricks-sdk>=0.79.0",
	"fastapi-mcp>=0.4.0",
	"fastapi>=0.116.2",
	"fastmcp>=2.12.3",
	"httpx>=0.25.0",
	"mcp[cli]>=1.14.0",
	"python-dotenv>=1.1.1",
	"pyyaml>=6.0.2",
	"unitycatalog-ai>=0.3.2",
	"uvicorn>=0.35.0",
	"pydantic>=2.0.0",
	"pytest>=8.3.4",
	"python-dotenv>=1.0.1",
	"requests>=2.32.5",
]

[dependency-groups]
dev = [
    "databricks-connect<=16.0",
    "databricks-dlt>=0.3.0",
    "databricks-mcp>=0.3.0",
    "databricks-sdk[notebook]>=0.79.0",
    "databricks-sql-connector>=4.0.5",
    "hatchling>=1.27.0",
    "ipykernel>=6.30.1",
    "nbformat>=5.10.4",
    "pip>=25.0.1",
    "plotly>=6.3.0",
    "polars>=1.33.1",
    "pytest>=8.3.4",
    "python-dotenv>=1.0.1",
    "ruff>=0.13.0",
    "tomli>=2.2.1",
    "mlflow>=2.13.0",
    "scikit-learn>=1.4.0",
]

[tool.ruff]
line-length = 100
indent-width = 2
# Assume Python 3.12.
target-version = "py312"
# Enable auto-fix
fix = true

# Exclude a variety of commonly ignored directories.
exclude = [
  "__pycache__",
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "client",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Enable Pyflakes `F`, pycodestyle "W" and `E`, "Q" quotes, "I" imports.
ignore = [
  "D105", # Missing docstring in magic method.
  "D106", # Missing docstring in a public nested class.
  "D107", # Missing docstring in __init__.
  "D203", # 1 blank line required before class docstring.
  "D204", # 1 blank line required after class docstring.
  "D213", # Multi-line docstring summary should start at the second line.
  "D401", # First line of docstring should be in imperative mood: "{first_line}"
  "D407", # Missing dashed underline after section.
]
select = ["E", "W", "F", "Q", "I", "D"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["D101", "D102", "D103", "D104"]
"__init__.py" = ["D104"]

[tool.ruff.lint.pep8-naming]
# Allow Pydantic's `@validator` decorator to trigger class method treatment.
classmethod-decorators = ["classmethod", "pydantic.validator"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
managed = true
