resources:
  jobs:
    chewy_churn_monitoring:
      name: chewy_churn_monitoring

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: 17.3.x-cpu-ml-scala2.13
            node_type_id: Standard_DS3_v2
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode

      tasks:
        - task_key: refresh_monitor
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../src/chewy_churn/06_monitor.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
