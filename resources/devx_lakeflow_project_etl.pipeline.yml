# The main pipeline for devx_lakeflow_project

resources:
  pipelines:
    devx_lakeflow_project_etl:
      name: devx_lakeflow_project_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src"

      libraries:
        - glob:
            include: ../src/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
