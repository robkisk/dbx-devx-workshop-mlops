resources:
  jobs:
    pet_churn_setup:
      name: pet_churn_setup

      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: 17.3.x-cpu-ml-scala2.13
            node_type_id: Standard_DS3_v2
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode

      tasks:
        - task_key: setup_data
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../src/pet_churn/00_setup_data.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: feature_engineering
          depends_on:
            - task_key: setup_data
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../src/pet_churn/01_feature_engineering.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
